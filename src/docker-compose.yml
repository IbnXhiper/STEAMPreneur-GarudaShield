services:
  engine:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["gs", "-config", "/etc/gs/garudashield.json"]
    env_file: .env
    volumes:
      - ./garudashield.docker.json:/etc/gs/garudashield.json:ro
      - ./data/GeoIP:/data/GeoIP:ro
    environment:
      GS_ADMIN_SECRET: "${GS_ADMIN_SECRET}"
      GS_ACCESS_SECRET: "${GS_ACCESS_SECRET}"
      GS_SESSION_SECRET: "${GS_SESSION_SECRET}"
      GS_LICENSE_SECRET: "${GS_LICENSE_SECRET}"
      GS_DATABASE_URL: "postgres://${POSTGRES_USER:-garuda}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-garudashield}?sslmode=disable"
      # Engine auto-enables Redis L2 when this is set (see config.applyEnvOverrides).
      # Without the redis profile below, leaving it "off" keeps the engine local.
      GS_REDIS_ENABLED: "${GS_REDIS_ENABLED:-off}"
      GS_REDIS_ADDR: "redis:6379"
      GS_REDIS_PREFIX: "gs"
    ports:
      - "8080:8080"
    restart: unless-stopped
    depends_on:
      upstream:
        condition: service_started
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: "${POSTGRES_USER:-garuda}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
      POSTGRES_DB: "${POSTGRES_DB:-garudashield}"
    # No host port publish: avoids colliding with local gs-postgres/native PG on 5432.
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  upstream:
    image: nginx:1.27-alpine
    volumes:
      - ./deploy/upstream-index.html:/usr/share/nginx/html/index.html:ro
    ports:
      - "3001:80"
    restart: unless-stopped

  web:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    environment:
      GS_API_URL: "http://engine:8080"
      GS_API_KEY: "${GS_ADMIN_SECRET}"
      # Local Docker serves HTTP directly. Production Caddy uses secure cookies.
      GS_COOKIE_SECURE: "false"
    ports:
      - "3000:3000"
    depends_on:
      - engine
    restart: unless-stopped

  # opsional: aktifkan dengan `GS_REDIS_ENABLED=on docker compose --profile redis up`
  redis:
    image: redis:7-alpine
    profiles: ["redis"]
    ports:
      - "6379:6379"
    restart: unless-stopped

volumes:
  postgres_dev_data:
