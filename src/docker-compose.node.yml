# Node override for a named cluster node (any id: node-1, ny1, ny2, edge-1, ...).
# Usage: docker compose -f docker-compose.prod.yml -f docker-compose.node.yml --env-file .env up -d
# (deploy.sh does this automatically for `./deploy.sh <node-id>`)
#
# This file:
#   - defines redis WITHOUT a profile (so it always runs in cluster mode)
#   - injects GS_NODE_ID + GS_REDIS_ENABLED=on into the engine
#   - sets GS_REDIS_ADDR to the redis service
#
# Every node in a cluster points at the SAME redis (or a Redis replica set) so
# blocklist mutations broadcast over Pub/Sub and warm peer nodes. For
# geo-redundancy, run one redis per site and use Redis replication / Sentinel.
#
# Running a single node with this overlay is valid: the bus stays warm and
# SYNC_NODE_COUNT=1 keeps the reported topology at "1 / 1 Online".

services:
  engine:
    environment:
      GS_REDIS_ENABLED: "on"
      GS_REDIS_ADDR: "redis:6379"
      GS_NODE_ID: "${GS_NODE_ID:-node-1}"

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    expose:
      - "6379"
    restart: unless-stopped
    networks:
      - edge

networks:
  edge:
    driver: bridge

volumes:
  redis_data:
